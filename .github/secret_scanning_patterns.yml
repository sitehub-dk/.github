# Custom secret-scanning patterns for sitehub-dk.
# Registered via `gh api -X POST orgs/sitehub-dk/secret-scanning/custom-patterns`
# after this PR merges (see scripts/register-secret-patterns.sh).
#
# Each pattern matches a token format that GHAS' generic detectors miss.
# Adding a new SiteHub-specific service? Add the pattern here and rerun the
# registration script.

patterns:
  - name: Hetzner API Key
    secret_format: 'HETZNER_API_KEY\s*=\s*[A-Fa-f0-9]{64}|hcloud_[A-Za-z0-9]{32,}'
    description: 'Hetzner Cloud API key (HETZNER_API_KEY env var or hcloud_ prefix)'

  - name: Proxmox API Token
    secret_format: '[A-Za-z0-9_-]+@(pam|pve)![A-Za-z0-9_-]+=[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
    description: 'Proxmox PVE API token in user@realm!name=<uuid> format'

  - name: e-conomic Agreement Token
    secret_format: 'ECONOMIC_(AGREEMENT|SECRET|PUBLIC)_TOKEN\s*=\s*[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
    description: 'e-conomic restapi/documentsapi auth token'

  - name: 1Password Service Account
    secret_format: 'ops_eyJ[A-Za-z0-9_-]{200,}'
    description: '1Password service-account token (JWT-ish payload)'

  - name: Tailscale API Key
    secret_format: 'tskey-(api|client)-[A-Za-z0-9_-]{20,}-[A-Za-z0-9_-]{20,}'
    description: 'Tailscale API key or OAuth client'

  - name: Pangolin API Key
    secret_format: 'PANGOLIN_API_KEY\s*=\s*[A-Za-z0-9_-]{32,}'
    description: 'Pangolin REST API token'

  - name: Better Auth Secret
    secret_format: 'BETTER_AUTH_SECRET\s*=\s*[A-Za-z0-9+/=]{32,}'
    description: 'Better Auth signing secret'

  - name: SiteHub Reports Auth Secret
    secret_format: 'SITEHUB_REPORTS_AUTH_SECRET\s*=\s*[A-Za-z0-9+/=]{32,}'
    description: 'sitehub-reports Better Auth secret'

  - name: Microsoft Entra Client Secret
    secret_format: 'ENTRA_SECRET\s*=\s*[A-Za-z0-9~_.-]{40,}'
    description: 'Microsoft Entra (Azure AD) client secret'

  - name: Cloudflare API Token
    secret_format: 'CF_API_TOKEN\s*=\s*[A-Za-z0-9_-]{40}'
    description: 'Cloudflare API token (scoped, not Global API Key)'
